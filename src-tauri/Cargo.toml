[package]
name = "my-yt-desktop"
version = "0.1.0"
description = "Lightweight Tauri + Rust YouTube desktop client with instant progressive playback and LRU background HD caching"
authors = ["My YT Desktop Contributors"]
edition = "2021"

[lib]
name = "my_yt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "sync", "time", "macros", "rt-multi-thread", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-core = "0.3"
bytes = "1"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
urlencoding = "2"
